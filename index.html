<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSCI 240 - Fall 2026 - Student Projects</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f8; margin: 0; padding: 84px 24px 24px; }

    /* Top menu */
    .menu { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: #4b2e83; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
    .menu ul { list-style: none; margin: 0 auto; padding: 0 12px; max-width: 900px; display: flex; flex-wrap: wrap; align-items: center; }
    .menu .brand { color: #fff; font-weight: bold; padding: 14px 12px; margin-right: auto; }
    .menu a { display: block; padding: 14px 16px; color: #fff; text-decoration: none; background: none; border-radius: 0; margin: 0; }
    .menu a:hover, .menu a.active { background: #6a45b5; }

    .box { max-width: 640px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    h1 { font-size: 22px; margin-top: 0; }
    #list { list-style: none; padding: 0; }
    #list li { margin: 8px 0; }
    #list a { display: block; padding: 10px 14px; background: #4b2e83; color: #fff; text-decoration: none; border-radius: 6px; }
    #list a:hover { background: #6a45b5; }
    .pending { display: block; padding: 10px 14px; background: #e6e6ea; color: #888; border-radius: 6px; }
  </style>
</head>
<body>
  <nav class="menu">
    <ul>
      <li class="brand">CSCI 240 - Fall 2026</li>
      <li><a class="active" href="index.html">Home</a></li>
      <li><a href="#projects">Student Projects</a></li>
      <li><a href="registration.html">Registration</a></li>
    </ul>
  </nav>

  <div class="box" id="projects">
    <h1>Student Projects</h1>
    <ul id="list"></ul>
  </div>

  <script>
    // Add a student's number here after you merge their pull request.
    const submitted = [1, 2, 11, 12 , 10 , 09];

    const total = 16;
    const list = document.getElementById("list");

    for (let i = 1; i <= total; i++) {
      const id = "student-" + String(i).padStart(2, "0");
      const li = document.createElement("li");

      if (submitted.includes(i)) {
        const a = document.createElement("a");
        a.href = "students_CSCI_240_01_Fall2026/" + id + "/test10.html";
        a.textContent = id;
        li.appendChild(a);
      } else {
        const s = document.createElement("span");
        s.className = "pending";
        s.textContent = id + " (not submitted yet)";
        li.appendChild(s);
      }
      list.appendChild(li);
    }
  </script>
</body>
</html>
